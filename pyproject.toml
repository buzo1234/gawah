[project]
name = "gawah"
version = "0.1.0"
description = "An AI witness for deals made on a call"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "pydantic>=2",
    "pydantic-settings",
    "boto3",
    "httpx",
    "websockets",
    "livekit==1.3.0",
    "livekit-api==2.0.1",
    "numpy>=2.5.5",
    "webrtcvad-wheels>=2.0.14.post1",
]

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["."]
