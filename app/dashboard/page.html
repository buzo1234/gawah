<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gawah</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="/dashboard/static/base.css">
<link rel="stylesheet" href="/dashboard/static/style.css">
</head>
<body class="board">
<div id="stage">
  <header class="top">
    <h1 id="deal-title"></h1>
    <span id="call-pill" class="pill"></span>
    <span class="mark" lang="hi" aria-label="Gawah">गवाह</span>
  </header>

  <section class="deal" aria-labelledby="deal-label">
    <div class="head"><h2 class="label" id="deal-label">The deal</h2><span id="settled-count" class="label"></span></div>
    <div id="terms" class="card">
      <ol id="rows"></ol>
      <div id="spine" class="spine">
        <span id="chain" class="chain label"></span>
        <span id="ticks" class="ticks" aria-hidden="true"></span>
        <span id="chain-head" class="label"></span>
      </div>
    </div>
    <div id="detail" class="card" aria-live="polite"></div>
  </section>

  <section class="moments" aria-labelledby="moments-label">
    <div class="head"><h2 class="label" id="moments-label">Timeline</h2><span id="fact-count" class="label"></span></div>
    <div class="card timeline-card">
      <button type="button" id="newer" class="pill newer" hidden></button>
      <ol id="timeline"></ol>
    </div>
  </section>

  <aside id="phone" aria-labelledby="phone-title">
    <div class="head"><h2 class="label" id="phone-title">Second phone</h2><button type="button" id="phone-back" class="quiet" hidden>Back to chat</button></div>
    <div class="device">
      <iframe id="phone-frame" title="Second phone" allow="microphone *; autoplay *"></iframe>
    </div>
  </aside>
</div>

<dialog id="deals" aria-labelledby="deals-title">
  <h2 id="deals-title">Show another deal</h2>
  <ol id="deal-list"></ol>
  <form method="dialog"><button class="quiet">Close</button></form>
</dialog>

<script type="module" src="/dashboard/static/app.js"></script>
</body>
</html>
