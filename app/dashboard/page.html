<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gawah</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="/dashboard/static/base.css">
<link rel="stylesheet" href="/dashboard/static/style.css">
</head>
<body class="board">
<div id="stage">
  <header class="heads">
    <div class="heading graph-head"><h2 id="graph-title">Knowledge graph</h2><span id="graph-count" class="meta"></span></div>
    <div class="heading contract-head"><h2 id="checklist-title">Contract</h2><span id="settled-count" class="meta"></span></div>
  </header>

  <section id="graph" aria-labelledby="graph-title">
    <svg id="edges" aria-hidden="true"></svg>
    <div id="nodes"></div>
    <ol id="items" aria-labelledby="checklist-title"></ol>
    <div id="card-slot"></div>
  </section>

  <footer id="timeline">
    <div class="chain-text"><span id="chain" class="chain"></span><span id="chain-head" class="meta"></span></div>
    <svg id="chain-links" aria-hidden="true"></svg>
  </footer>

  <aside id="phone" aria-labelledby="phone-title">
    <header class="heading phone-head">
      <h2 id="phone-title">Second phone</h2>
      <button type="button" id="phone-back" class="quiet" hidden>Back to chat</button>
    </header>
    <div class="device">
      <iframe id="phone-frame" title="Second phone" allow="microphone *; autoplay *"></iframe>
    </div>
  </aside>
</div>

<dialog id="deals" aria-labelledby="deals-title">
  <h2 id="deals-title">Show another deal</h2>
  <ol id="deal-list"></ol>
  <form method="dialog"><button class="quiet">Close</button></form>
</dialog>

<script type="module" src="/dashboard/static/app.js"></script>
</body>
</html>
