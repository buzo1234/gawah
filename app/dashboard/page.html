<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gawah</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="/dashboard/static/base.css">
<link rel="stylesheet" href="/dashboard/static/style.css">
</head>
<body class="board">
<main>
  <section class="panel" id="checklist" aria-labelledby="checklist-title">
    <header class="panel-head">
      <h2 id="checklist-title">Contract</h2>
      <span id="settled-count" class="meta"></span>
    </header>
    <ol id="items"></ol>
  </section>

  <section class="panel" id="knowledge" aria-labelledby="graph-title">
    <header class="panel-head">
      <h2 id="graph-title">Knowledge graph</h2>
      <span id="graph-count" class="meta"></span>
      <span id="chain" class="chain"></span>
    </header>
    <div id="graph"></div>
  </section>

  <aside class="panel" id="phone" aria-labelledby="phone-title">
    <header class="panel-head">
      <h2 id="phone-title">Second phone</h2>
      <button type="button" id="phone-back" class="quiet" hidden>Back to chat</button>
    </header>
    <div class="device">
      <iframe id="phone-frame" title="Second phone" allow="microphone *; autoplay *"></iframe>
    </div>
  </aside>
</main>

<dialog id="deals" aria-labelledby="deals-title">
  <h2 id="deals-title">Show another deal</h2>
  <ol id="deal-list"></ol>
  <form method="dialog"><button class="quiet">Close</button></form>
</dialog>

<script type="module" src="/dashboard/static/app.js"></script>
</body>
</html>
