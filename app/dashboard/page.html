<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Gawah - events</title>
<style>
  body { font: 15px/1.4 system-ui, sans-serif; margin: 0; background: #111; color: #ddd; }
  header { padding: 10px 16px; background: #1c1c1c; position: sticky; top: 0; }
  #status { float: right; color: #888; }
  #log { padding: 8px 16px 40px; }
  .row { display: grid; grid-template-columns: 90px 220px 1fr; gap: 12px; padding: 4px 0; border-bottom: 1px solid #222; }
  .time { color: #777; }
  .name { color: #6cb6ff; }
  .hirer { color: #ffd479; }
  .worker { color: #8ddb8c; }
  .judge { color: #ff9580; }
  .body { white-space: pre-wrap; word-break: break-word; }
</style>
</head>
<body>
<header><b>Gawah</b> - every event, live <span id="status">connecting</span></header>
<div id="log"></div>
<script>
const log = document.getElementById("log");
const status = document.getElementById("status");
const META = ["name", "deal_id", "ts", "event_id"];

function describe(e) {
  if (e.name === "transcript.line") return { cls: e.speaker, text: `${e.speaker}: ${e.text}` };
  if (e.name.startsWith("judge.")) return { cls: "judge", text: e.text || `${e.reason} -> ${e.to}: ${e.instruction}` };
  const rest = Object.fromEntries(Object.entries(e).filter(([k]) => !META.includes(k)));
  return { cls: "", text: JSON.stringify(rest) };
}

function show(e) {
  const { cls, text } = describe(e);
  const row = document.createElement("div");
  row.className = "row";
  for (const [c, t] of [["time", new Date(e.ts).toLocaleTimeString()], ["name", `${e.name} · ${e.deal_id}`], [`body ${cls}`, text]]) {
    const cell = document.createElement("div");
    cell.className = c;
    cell.textContent = t;
    row.append(cell);
  }
  log.append(row);
  window.scrollTo(0, document.body.scrollHeight);
}

function connect() {
  const ws = new WebSocket(`${location.protocol === "https:" ? "wss" : "ws"}://${location.host}/dashboard/ws`);
  ws.onopen = () => (status.textContent = "live");
  ws.onmessage = (m) => show(JSON.parse(m.data));
  ws.onclose = () => { status.textContent = "reconnecting"; setTimeout(connect, 1000); };
}
connect();
</script>
</body>
</html>
