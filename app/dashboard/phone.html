<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gawah · second phone</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="/dashboard/static/base.css">
<link rel="stylesheet" href="/dashboard/static/phone.css">
</head>
<body class="phone-page">
<div class="phone">
  <header class="top">
    <div class="who">
      <h1 id="name">Second phone</h1>
      <label class="number"><span class="visually-hidden">Number</span>
        <input id="number" type="tel" inputmode="tel" autocomplete="off" spellcheck="false">
      </label>
    </div>
    <label class="actor" id="actor" hidden>
      <input type="checkbox" id="actor-on">
      <span class="switch" aria-hidden="true"></span>
      <span>AI plays this person</span>
    </label>
  </header>

  <div id="call-state" class="call-state" role="status" hidden></div>

  <div id="chat" class="chat"></div>

  <form id="composer" autocomplete="off">
    <div id="attached" class="attached" hidden></div>
    <div class="row">
      <div class="attach">
        <button type="button" id="attach" class="round plain" aria-label="Attach a photo or a voice note" aria-haspopup="menu" aria-expanded="false" title="Attach"><span data-icon="plus"></span></button>
        <div id="attach-menu" class="menu" role="menu" hidden>
          <button type="button" role="menuitem" data-accept="image/jpeg,image/png,image/webp"><span data-icon="photo"></span>Photo</button>
          <button type="button" role="menuitem" data-accept="audio/*"><span data-icon="mic"></span>Voice note</button>
        </div>
        <input id="file" type="file" accept="image/jpeg,image/png,image/webp,audio/*" hidden>
      </div>
      <input id="text" type="text" placeholder="Message" aria-label="Message">
      <button type="submit" id="send" class="round send" aria-label="Send" title="Send" disabled><span data-icon="send"></span></button>
    </div>
    <div id="send-status" class="send-status" role="status"></div>
  </form>
</div>
<script type="module" src="/dashboard/static/phone.js"></script>
</body>
</html>
