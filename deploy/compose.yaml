# Gawah on the server: the app and Caddy in front of it (HTTPS for <ip>.sslip.io).
# Run by tools/deploy/deploy.sh as:
#   docker compose -f deploy/compose.yaml --env-file /opt/gawah/host.env up -d --build
# /opt/gawah/host.env is written once by the instance's first boot (tools/deploy/provision.sh)
# and holds GAWAH_ADDRESS (the sslip.io name) and GAWAH_SECRET_ID. No keys are in it.

services:
  app:
    build: ..
    restart: unless-stopped
    environment:
      GAWAH_SECRET_ID: ${GAWAH_SECRET_ID:-gawah/prod}
      AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION:-us-west-2}
      # The environment wins over the secret, so these beat any laptop value in .env.
      PUBLIC_BASE_URL: https://${GAWAH_ADDRESS:?set GAWAH_ADDRESS in /opt/gawah/host.env}
      DATABASE_PATH: /data/gawah.db
    volumes:
      - data:/data
    shm_size: 256m  # Chrome prints the PDF; Docker's 64 MB default is tight for it
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s

  caddy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    depends_on:
      - app
    environment:
      GAWAH_ADDRESS: ${GAWAH_ADDRESS}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy:/data

volumes:
  data:      # the database, recordings, the memory's cache, the Sentinel's reminders
  caddy:     # the Let's Encrypt certificate, so a redeploy does not ask for a new one
