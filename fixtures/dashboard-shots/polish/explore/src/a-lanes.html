<!doctype html>
<meta charset="utf-8">
<link rel="stylesheet" href="/app/dashboard/static/base.css">
<style>
body { margin: 0; width: 1920px; height: 1080px; background: var(--bg); font-family: var(--font); }
.cap { position: absolute; left: 48px; top: 40px; font: 500 24px var(--font); }
.cap small { display: block; font: 400 16px var(--font); color: var(--ink-3); margin-top: 4px; }
#g { position: absolute; left: 48px; top: 140px; width: 960px; background: #fff; border: 1px solid var(--rule); border-radius: 10px; }
.row { position: relative; display: flex; height: 100px; border-bottom: 1px solid var(--rule); }
.node { width: 288px; padding: 16px 20px; flex: none; border-right: 1px solid var(--rule); }
.node .l { display: flex; justify-content: space-between; font: 400 14px/20px var(--mono); letter-spacing: .08em; color: var(--ink-3); text-transform: uppercase; }
.node .v { font: 600 24px/30px var(--font); margin-top: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.node .v.t { font-size: 18px; line-height: 24px; white-space: normal; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
.node .v.none { color: var(--ink-3); font-weight: 400; font-size: 18px; }
.ok { color: var(--ok); } .bad { color: var(--bad); }
.lane { position: relative; flex: 1; display: flex; align-items: flex-end; gap: 20px; padding: 0 20px 16px; }
.chip { position: relative; max-width: 168px; padding: 6px 10px 6px 12px; border: 1px solid var(--rule-strong); border-radius: 6px; font: 500 16px/22px var(--font); background: #fff; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.chip::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 4px; background: var(--who); }
.chip.agreed, .chip.confirmed { border-color: var(--ok); background: var(--ok-wash); color: var(--ok); }
.chip.superseded { color: var(--ink-3); text-decoration: line-through; border-style: dashed; }
.chip.claim { border-color: var(--bad); color: var(--bad); background: var(--bad-wash); }
.chip.pay { border-style: dotted; }
svg.edges { position: absolute; inset: 0; pointer-events: none; overflow: visible; }
.chain { display: flex; align-items: center; gap: 16px; height: 48px; padding: 0 20px; font: 400 14px var(--mono); letter-spacing: .08em; color: var(--ok); text-transform: uppercase; }
.ticks { display: flex; gap: 4px; } .ticks i { width: 4px; height: 16px; border-radius: 2px; background: var(--ok); opacity: .7; }
</style>
<div class="cap">A · Term lanes: the contract is the graph<small>Each term a node; its versions grow to the right as they are said; replaced dashed; red arc where a claim contradicts.</small></div>
<div id="g"></div>
<script type="module">
import { folded, ITEMS, laneFacts, money, COLORS, standing } from "./common.js";
const s = await folded();
const g = document.getElementById("g");
const conflictIds = new Set(s.conflicts.flatMap((c) => c.factIds));
const claimIds = new Set(s.conflicts.map((c) => s.factOrder.map((i) => s.facts[i]).findLast((f) => f.line_no === c.lineNo && f.call_no === c.callNo && f.item)?.id));
for (const [key, label] of ITEMS) {
  const st = standing(s, key);
  const row = document.createElement("div"); row.className = "row";
  const contradicted = st && conflictIds.has(st.id);
  row.innerHTML = `<div class="node"><div class="l"><span>${label}</span><span class="${st ? "ok" : ""}">${contradicted ? '<b class="bad">Contradicted</b>' : st ? (st.status === "confirmed" ? "Confirmed" : "Agreed") : "Waiting"}</span></div>
    <div class="v ${st ? (st.value_rupees ? "" : "t") : "none"}">${st ? money(st) : "Waiting"}</div></div><div class="lane"></div>`;
  const lane = row.querySelector(".lane");
  const facts = laneFacts(s, key).slice(-4);
  for (const f of facts) {
    const c = document.createElement("div");
    c.className = `chip ${claimIds.has(f.id) ? "claim" : f.status} ${f.kind === "payment" ? "pay" : ""}`;
    c.style.setProperty("--who", COLORS[f.said_by] || COLORS.none);
    c.dataset.id = f.id; c.textContent = money(f); lane.append(c);
  }
  g.append(row);
  requestAnimationFrame(() => {
    const svg = document.createElementNS("http://www.w3.org/2000/svg", "svg"); svg.setAttribute("class", "edges");
    const box = lane.getBoundingClientRect(); const chips = [...lane.children];
    chips.forEach((c, i) => { if (!i) return; const a = chips[i - 1].getBoundingClientRect(), b = c.getBoundingClientRect();
      svg.innerHTML += `<line x1="${a.right - box.left}" y1="${a.top + a.height / 2 - box.top}" x2="${b.left - box.left}" y2="${b.top + b.height / 2 - box.top}" stroke="#9a9b97" stroke-dasharray="${chips[i - 1].classList.contains("superseded") ? "3 3" : ""}"/>`; });
    for (const c of chips.filter((c) => c.classList.contains("claim"))) {
      const t = chips.find((x) => conflictIds.has(x.dataset.id)); if (!t) continue;
      const a = c.getBoundingClientRect(), b = t.getBoundingClientRect();
      const x1 = a.left + a.width / 2 - box.left, x2 = b.left + b.width / 2 - box.left, y = a.top - box.top;
      svg.innerHTML += `<path d="M${x1} ${y} C ${x1} ${y - 30}, ${x2} ${y - 30}, ${x2} ${y}" fill="none" stroke="#b3261e" stroke-width="2"/><text x="${(x1 + x2) / 2}" y="${y - 26}" fill="#b3261e" font-family="IBM Plex Mono" font-size="14" text-anchor="middle">contradicts</text>`;
    }
    lane.append(svg);
  });
}
g.insertAdjacentHTML("beforeend", `<div class="chain">Witness chain · verified · ${s.chain.links} links <span class="ticks">${"<i></i>".repeat(Math.min(60, s.chain.links))}</span></div>`);
</script>
