<!doctype html>
<meta charset="utf-8">
<link rel="stylesheet" href="/app/dashboard/static/base.css">
<style>
body { margin: 0; width: 1920px; height: 1080px; background: var(--bg); font-family: var(--font); }
.cap { position: absolute; left: 48px; top: 40px; font: 500 24px var(--font); }
.cap small { display: block; font: 400 16px var(--font); color: var(--ink-3); margin-top: 4px; }
#g { position: absolute; left: 48px; top: 140px; width: 960px; height: 880px; background: #fff; border: 1px solid var(--rule); border-radius: 10px; }
svg text { font-family: var(--font); }
</style>
<div class="cap">B · Hub and spokes: the deal at the centre<small>Six terms in a ring around the deal; each fact a dot on its term's spoke, newest outermost; the contradiction a red chord.</small></div>
<svg id="g" viewBox="0 0 960 880"></svg>
<script type="module">
import { folded, ITEMS, laneFacts, money, COLORS, standing } from "./common.js";
const s = await folded();
const g = document.getElementById("g");
const cx = 480, cy = 440;
let out = `<circle cx="${cx}" cy="${cy}" r="70" fill="#f4f4ef" stroke="#e2e2dc"/><text x="${cx}" y="${cy - 6}" text-anchor="middle" font-size="22" font-weight="600">${s.people.hirer?.name} · ${s.people.worker?.name}</text><text x="${cx}" y="${cy + 22}" text-anchor="middle" font-size="16" fill="#6b6d72">${s.chain.links} facts</text>`;
const conflictIds = new Set(s.conflicts.flatMap((c) => c.factIds));
const pos = {};
ITEMS.forEach(([key, label], i) => {
  const a = -Math.PI / 2 + (i * Math.PI * 2) / 6;
  const nx = cx + Math.cos(a) * 200, ny = cy + Math.sin(a) * 200;
  const st = standing(s, key);
  out += `<line x1="${cx + Math.cos(a) * 70}" y1="${cy + Math.sin(a) * 70}" x2="${nx}" y2="${ny}" stroke="${st ? "#1e5b3e" : "#c8c8c1"}" stroke-width="2"/>`;
  out += `<rect x="${nx - 92}" y="${ny - 34}" width="184" height="68" rx="10" fill="${st ? "#e2ede5" : "#fff"}" stroke="${st ? "#1e5b3e" : "#c8c8c1"}"/>`;
  out += `<text x="${nx}" y="${ny - 10}" text-anchor="middle" font-family="IBM Plex Mono" font-size="14" fill="#6b6d72">${label.toUpperCase().slice(0, 18)}</text>`;
  out += `<text x="${nx}" y="${ny + 18}" text-anchor="middle" font-size="18" font-weight="600" fill="${st ? "#1e5b3e" : "#6b6d72"}">${st ? money(st).slice(0, 18) : "Waiting"}</text>`;
  laneFacts(s, key).slice(-5).forEach((f, j) => {
    const r = 300 + j * 26, b = a + (j % 2 ? 0.08 : -0.08);
    const x = cx + Math.cos(b) * r, y = cy + Math.sin(b) * r;
    pos[f.id] = [x, y];
    out += `<circle cx="${x}" cy="${y}" r="9" fill="${f.status === "agreed" || f.status === "confirmed" ? "#1e5b3e" : "#fff"}" stroke="${COLORS[f.said_by] || COLORS.none}" stroke-width="3"/>`;
    if (j === Math.min(4, laneFacts(s, key).length - 1)) out += `<text x="${x + (Math.cos(b) > 0 ? 16 : -16)}" y="${y + 5}" text-anchor="${Math.cos(b) > 0 ? "start" : "end"}" font-size="16" fill="#4f5156">${money(f).slice(0, 22)}</text>`;
  });
});
for (const c of s.conflicts) {
  const claim = s.factOrder.map((i) => s.facts[i]).findLast((f) => f.line_no === c.lineNo && f.call_no === c.callNo && f.item);
  const t = c.factIds.find((id) => pos[id]);
  if (claim && pos[claim.id] && t) out += `<path d="M${pos[claim.id]} Q ${cx} ${cy - 360} ${pos[t]}" fill="none" stroke="#b3261e" stroke-width="2.5"/>`;
}
g.innerHTML = out;
</script>
